<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:">
  <title>Vyuha</title>
  <link rel="stylesheet" href="../node_modules/monaco-editor/min/vs/editor/editor.main.css" data-name="vs/editor/editor.main">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="chrome">
    <div class="tabstrip">
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="newTab" class="newtab" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
    </div>
    <div class="toolbar">
      <button id="back" class="nav" title="Back" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="fwd" class="nav" title="Forward" aria-label="Forward">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="reload" class="nav" title="Reload" aria-label="Reload">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 8a5 5 0 1 1-1.5-3.55M13 2.5V5h-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="home" class="nav" title="Home" aria-label="Home">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 7.5 8 3l5.5 4.5V13a.5.5 0 0 1-.5.5H9.5V10h-3v3.5H3a.5.5 0 0 1-.5-.5V7.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
      <form id="addrForm" class="address" autocomplete="off">
        <input id="address" spellcheck="false" placeholder="Search or enter address" aria-label="Address bar">
      </form>
      <div id="toast" class="toast" role="status" hidden></div>
      <div id="ctx" class="ctx"></div>
    </div>
  </header>
  <main id="content"></main>
  <div id="overlay" class="overlay" hidden><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>
  <!-- Monaco, the editor engine from VS Code (npm install monaco-editor). If it's missing, files open read-only. -->
  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
